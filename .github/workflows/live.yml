name: Live wiki check

# The app against the real RuneScape Wiki: every Monday, by hand (Actions → Live wiki check → Run workflow), and on a
# pull request that changes how the app reads the wiki. When it fails, the wiki changed, or the reader did.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/wiki/**'
      - 'tests/live.spec.js'
      - 'tests/player.live.spec.js'
      - 'tests/support/**'
      - '.github/workflows/live.yml'

permissions:
  contents: read

jobs:
  live:
    name: Live wiki check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 14
